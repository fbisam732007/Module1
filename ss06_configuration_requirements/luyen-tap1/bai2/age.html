<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 2: Nhập tuổi và in ra kết quả nếu tuổi học sinh đó không đủ điều kiện vào học lớp 10.</title>
</head>
<body>

<h2>Kiểm tra điều kiện vào lớp 10</h2>

<label>Nhập tuổi học sinh: </label>
<input type="number" id="tuoi" placeholder="Nhập tuổi">
<br><br>

<button onclick="kiemTraTuoi()">Kiểm tra</button>

<p id="result" style="font-weight: bold; margin-top: 10px;"></p>

<script>
    function kiemTraTuoi() {
        let tuoi = document.getElementById('tuoi').value;
        let soTuoi = Number(tuoi);

        if (soTuoi <= 0) {
            document.getElementById('result').innerHTML = "Vui lòng nhập tuổi hợp lệ (> 0)";
            return;
        }

        if (soTuoi < 15) {
            document.getElementById('result').innerHTML =
                " Học sinh " + soTuoi + " tuổi KHÔNG đủ điều kiện vào lớp 10 (cần từ 15 tuổi trở lên)";
        } else if (soTuoi === 15) {
            document.getElementById('result').innerHTML =
                "Học sinh " + soTuoi + " tuổi ĐỦ điều kiện vào lớp 10 (tuổi chuẩn)";
        } else if (soTuoi > 15 && soTuoi <= 20) {
            document.getElementById('result').innerHTML =
                " Học sinh " + soTuoi + " tuổi ĐỦ điều kiện vào lớp 10 (tuy nhiên đã quá tuổi chuẩn)";
        } else {
            document.getElementById('result').innerHTML =
                " Học sinh " + soTuoi + " tuổi không phù hợp để vào lớp 10 (tuổi quá lớn)";
        }
    }
</script>

</body>
</html>
