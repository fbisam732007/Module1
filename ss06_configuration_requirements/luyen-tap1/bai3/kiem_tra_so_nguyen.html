<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3: Kiểm tra số nguyên</title>
</head>
<body>

<h2>Kiểm tra số nguyên lớn hơn hay nhỏ hơn 0</h2>

<label>Nhập một số nguyên: </label>
<input type="number" id="soNguyen" placeholder="Nhập số nguyên">
<br><br>

<button onclick="kiemTraSo()">Kiểm tra</button>

<p id="result" style="font-weight: bold; margin-top: 10px;"></p>

<script>
    function kiemTraSo() {
        let so = document.getElementById('soNguyen').value;
        let soNumber = Number(so);

        if (isNaN(soNumber) || so === "") {
            document.getElementById('result').innerHTML = "Vui lòng nhập một số nguyên hợp lệ";
            return;
        }

        if (!Number.isInteger(soNumber)) {
            document.getElementById('result').innerHTML = "Vui lòng nhập số nguyên (không có phần thập phân)";
            return;
        }

        if (soNumber > 0) {
            document.getElementById('result').innerHTML = soNumber + " là số LỚN HƠN 0";
        } else if (soNumber < 0) {
            document.getElementById('result').innerHTML = soNumber + " là số NHỎ HƠN 0";
        } else {
            document.getElementById('result').innerHTML = soNumber + " là số BẰNG 0";
        }
    }
</script>

</body>
</html>
