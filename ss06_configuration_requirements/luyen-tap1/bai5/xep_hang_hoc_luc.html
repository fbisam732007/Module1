<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 5: Xếp hạng học lực</title>
</head>
<body>

<h2>Xếp hạng học lực của học sinh</h2>

<label>Nhập điểm bài kiểm tra (hệ số 1): </label>
<input type="number" id="diemKiemTra" placeholder="Nhập điểm (0-10)" step="0.1">
<br><br>

<label>Nhập điểm thi giữa kỳ (hệ số 2): </label>
<input type="number" id="diemGiuaKy" placeholder="Nhập điểm (0-10)" step="0.1">
<br><br>

<label>Nhập điểm thi cuối kỳ (hệ số 3): </label>
<input type="number" id="diemCuoiKy" placeholder="Nhập điểm (0-10)" step="0.1">
<br><br>

<button onclick="xepHang()">Xếp hạng học lực</button>

<p id="result" style="font-weight: bold; margin-top: 10px;"></p>

<script>
    function xepHang() {
        let kt = document.getElementById('diemKiemTra').value;
        let gk = document.getElementById('diemGiuaKy').value;
        let ck = document.getElementById('diemCuoiKy').value;

        let diemKT = Number(kt);
        let diemGK = Number(gk);
        let diemCK = Number(ck);

        if (isNaN(diemKT) || isNaN(diemGK) || isNaN(diemCK) || kt === "" || gk === "" || ck === "") {
            document.getElementById('result').innerHTML = "Vui lòng nhập đầy đủ 3 điểm";
            return;
        }

        if (diemKT < 0 || diemKT > 10 || diemGK < 0 || diemGK > 10 || diemCK < 0 || diemCK > 10) {
            document.getElementById('result').innerHTML = "Vui lòng nhập điểm trong khoảng 0 đến 10";
            return;
        }

        let diemTB = (diemKT * 1 + diemGK * 2 + diemCK * 3) / 6;

        let xepLoai;
        if (diemTB >= 9.0) {
            xepLoai = "Xuất sắc";
        } else if (diemTB >= 8.0) {
            xepLoai = "Giỏi";
        } else if (diemTB >= 6.5) {
            xepLoai = "Khá";
        } else if (diemTB >= 5.0) {
            xepLoai = "Trung bình";
        } else if (diemTB >= 3.5) {
            xepLoai = "Yếu";
        } else {
            xepLoai = "Kém";
        }

        document.getElementById('result').innerHTML =
            "Điểm trung bình: " + diemTB.toFixed(2) + " - Xếp loại: " + xepLoai;
    }
</script>

</body>
</html>
