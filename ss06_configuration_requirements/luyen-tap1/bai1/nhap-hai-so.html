<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 1: Nhập vào hai số a và b, và kiểm tra xem a có chia hết cho b hay không</title>
</head>
<body>
<label>Nhập số a: </label>
<input type="number" id="soA" placeholder="Nhập số a">
<br><br>

<label>Nhập số b: </label>
<input type="number" id="soB" placeholder="Nhập số b">
<br><br>
<button onclick="kiemTraChiaHet()">Kiểm tra</button>
<p id="result" style="font-weight: bold; margin-top: 10px "></p>

<script>
    function kiemTraChiaHet() {
        let a = document.getElementById("soA").value;
        let b = document.getElementById("soB").value;

        let soA = Number(a);
        let soB = Number(b);

        if (soA <= 0 || soB <= 0) {
            document.getElementById('result').innerHTML = "Hãy nhập số nguyên dương ";
            return;
        }
        if (soB === 0) {
            document.getElementById('result').innerHTML = "Không chia hết cho 0";
            return;
        }
        if (soA % soB === 0) {

            document.getElementById('result').innerHTML = " " + soA + "chia hết cho " + soB + "(vì " + soA + "/" + soB + " = " + (soA / soB) + ")";
        } else {
            document.getElementById('result').innerHTML =
                " " + soA + " KHÔNG chia hết cho " + soB + " (vì " + soA + " / " + soB + " = " + (soA / soB) + ", dư " + (soA % soB) + ")";
        }
    }
</script>
</body>
</html>
