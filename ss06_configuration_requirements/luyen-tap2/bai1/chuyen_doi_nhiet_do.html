<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1: Chuyển đổi nhiệt độ</title>
</head>
<body>

<h2>Chuyển đổi từ độ C sang độ F</h2>

<label>Nhập nhiệt độ (°C): </label>
<input type="number" id="doC" placeholder="Nhập độ C" step="0.1">
<br><br>

<button onclick="chuyenDoi()">Chuyển đổi</button>

<p id="result" style="font-weight: bold; margin-top: 10px;"></p>

<script>
    function chuyenDoi() {
        let c = document.getElementById('doC').value;
        let doC = Number(c);

        if (isNaN(doC) || c === "") {
            document.getElementById('result').innerHTML = "Vui lòng nhập nhiệt độ hợp lệ";
            return;
        }

        let doF = doC * 9 / 5 + 32;

        document.getElementById('result').innerHTML =
            doC + "°C = " + doF.toFixed(2) + "°F";
    }
</script>

</body>
</html>
