<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3>Giải phương trình bậc 2: ax² + bx + c = 0</h3>

<label>Nhập a: </label>
<input type="number" id="heSoA" step="any" placeholder="Nhập số">
<br><br>

<label>Nhập b: </label>
<input type="number" id="heSoB" step="any" placeholder="Nhập số">
<br><br>

<label>Nhập c: </label>
<input type="number" id="heSoC" step="any" placeholder="Nhập số">
<br><br>

<button onclick="giaiPhuongTrinh()">Giải phương trình</button>
<br><br>

<p id="ketQua"></p>

<script>
    function giaiPhuongTrinh() {
        let a = parseFloat(document.getElementById("heSoA").value);
        let b = parseFloat(document.getElementById("heSoB").value);
        let c = parseFloat(document.getElementById("heSoC").value);

        if (isNaN(a) || isNaN(b) || isNaN(c)) {
            document.getElementById("ketQua").innerHTML = "Vui lòng nhập số hợp lệ!";
            return;
        }

        if (a === 0) {
            if (b === 0) {
                if (c === 0) {
                    document.getElementById("ketQua").innerHTML = "Phương trình vô số nghiệm";
                } else {
                    document.getElementById("ketQua").innerHTML = "Phương trình vô nghiệm";
                }
            } else {
                let x = -c / b;
                document.getElementById("ketQua").innerHTML = "Phương trình có nghiệm: x = " + x;
            }
            return;
        }

        let delta = b * b - 4 * a * c;

        if (delta < 0) {
            document.getElementById("ketQua").innerHTML = "Phương trình vô nghiệm";
        } else if (delta === 0) {
            let x = -b / (2 * a);
            document.getElementById("ketQua").innerHTML = "Phương trình có nghiệm kép: x = " + x;
        } else {
            let x1 = (-b + Math.sqrt(delta)) / (2 * a);
            let x2 = (-b - Math.sqrt(delta)) / (2 * a);
            document.getElementById("ketQua").innerHTML = "Phương trình có 2 nghiệm: x₁ = " + x1 + ", x₂ = " + x2;
        }
    }
</script>
</body>
</html>
