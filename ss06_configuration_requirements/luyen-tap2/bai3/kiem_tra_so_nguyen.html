<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3: Kiểm tra số nguyên</title>
</head>
<body>

<h2>kiểm tra số nguyên</h2>
<input type="number" id="soNguyen" placeholder="nhập số nguyên">
<button onclick="kiemTraSo()">Kiểm tra</button>
<p id="result"></p>

<script>
    function kiemTraSo() {
        let so = document.getElementById("soNguyen").value;
        let soNumber = Number(so);

    if (isNaN(soNumber) || so === "" ) {
        document.getElementById("result").innerHTML = "hãy nhập 1 số nguyên";
        return;
    }
    if (!Number.isInteger(soNumber)) {
        document.getElementById('result').innerHTML = "hãy nhập số nguyên";
        return;
    }
    if (soNumber > 0) {
        document.getElementById('result').innerHTML = soNumber + "số lớn hơn 0";
    } else if (soNumber < 0) {
        document.getElementById('result').innerHTML = soNumber + "số nhỏ hơn 0";
    } else {
        document.getElementById('result').innerHTML = soNumber + "là số bằng 0";
    }
    }
</script>
</body>
</html>
