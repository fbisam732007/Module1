<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3>Giải phương trình bậc 1: ax + b = 0</h3>

<label>Nhập a: </label>
<input type="number" id="heSoA" step="any" placeholder="Nhập số">
<br><br>

<label>Nhập b: </label>
<input type="number" id="heSoB" step="any" placeholder="Nhập số">
<br><br>

<button onclick="giaiPhuongTrinh()">Giải phương trình</button>
<br><br>

<p id="ketQua"></p>

<script>
    function giaiPhuongTrinh() {
        let a = parseFloat(document.getElementById("heSoA").value);
        let b = parseFloat(document.getElementById("heSoB").value);

        if (isNaN(a) || isNaN(b)) {
            document.getElementById("ketQua").innerHTML = "Vui lòng nhập số hợp lệ!";
        } else if (a === 0) {
            if (b === 0) {
                document.getElementById("ketQua").innerHTML = "Phương trình vô số nghiệm";
            } else {
                document.getElementById("ketQua").innerHTML = "Phương trình vô nghiệm";
            }
        } else {
            let x = -b / a;
            document.getElementById("ketQua").innerHTML = "Nghiệm của phương trình: x = " + x;
        }
    }
</script>
</body>
</html>
