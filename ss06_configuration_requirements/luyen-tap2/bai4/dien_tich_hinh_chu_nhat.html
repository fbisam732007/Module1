<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diện tích HCN</title>
</head>
<body>
<h3>Tính diện tích hình chữ nhật</h3>

<label>Nhập cạnh a: </label>
<input type="number" id="canhA" placeholder="Nhập số">
<br><br>

<label>Nhập cạnh b: </label>
<input type="number" id="canhB" placeholder="Nhập số">
<br><br>

<button onclick="tinhDienTich()">Tính diện tích</button>
<br><br>

<p id="ketQua"></p>

<script>
    function tinhDienTich() {
        let a = parseFloat(document.getElementById("canhA").value);
        let b = parseFloat(document.getElementById("canhB").value);

        if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
            document.getElementById("ketQua").innerHTML = "Vui lòng nhập số dương hợp lệ!";
        } else {
            let dienTich = a * b;
            document.getElementById("ketQua").innerHTML = "Diện tích hình chữ nhật = " + dienTich;
        }
    }
</script>
</body>
</html>
