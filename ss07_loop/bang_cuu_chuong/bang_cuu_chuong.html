<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1> Bảng cửu chương </h1>
<table border="4" cellpadding="5" cellspacing="0">
<script>
    for (let i = 1; i <= 9; i++) {
    document.write("<tr>");
    for (let j = 2; j <= 9; j++) {
        document.write("<td>" + j + "x" + i + " = " + (j * i) + "<td>" );
    }
    document.write("</tr>");
    }

</script>
</table>
</body>
</html>
