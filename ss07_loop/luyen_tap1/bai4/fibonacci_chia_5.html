<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fibonacci_chia_5</title>
</head>
<body>
<h2>fibanocci chia hết cho 5</h2>
<button onclick="fibonacciChia5()">Click Me</button>
<p id="ketQua"></p>
<script>
    function fibonacciChia5() {
    let f0 = 0;
    let f1 = 1;
    let viTri = 2;
    let ketQua = " ";

    if (f0 % 5 === 0) {
        ketQua = "  số fibonacci đầu tiên chia hết cho 5 " + f0 + " (vị trí 1) ";
    }else if (f1 % 5 === 0) {
        ketQua = " số fibonacci đầu tiên chia hết cho 5 " + f1 + " (vị trí 2) ";

    }else {
        while (true) {
            let f2 = f0 + f1;
            viTri++;
            if (f2 % 5 === 0) {
                ketQua = " số fibonacci đầu tiên chia hết cho 5 " + f2 + " (vị trí " + viTri + ") ";
                break;
            }
            f0 = f1;
            f1 = f2;
        }
    }
    document.getElementById("ketQua").innerHTML = ketQua;


    }
</script>
</body>
</html>
